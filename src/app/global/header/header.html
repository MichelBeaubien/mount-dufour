<header class="site-header">
    <div class="site-header__status">
        <div class="site-header__container">
            <div class="site-header__status-left">
                <app-status-message [message]="mountainService.season().message"
                                    [status]="mountainService.season().status"
                ></app-status-message>
            </div>

            <div class="site-header__status-links">
                <a routerLink="/mountain/conditions">
                    <i class="fas fa-mountain" aria-hidden="true"></i>
                    <span>Conditions</span>
                </a>

                <a routerLink="/mountain/hours">
                    <i class="fas fa-clock" aria-hidden="true"></i>
                    <span>Hours</span>
                </a>

                <span>
                    <i class="fas fa-location-dot" aria-hidden="true"></i>&nbsp;Elliot Lake, Ontario
                </span>
            </div>
        </div>
    </div>

    <div class="site-header__main">
        <div class="site-header__container">
            <a class="site-header__brand"
               routerLink="/"
               (click)="closeMenu()"
               aria-label="Mount Dufour home"
            >
                <span class="site-header__brand-name">
                    Mount Dufour
                </span>

                <span class="site-header__brand-subtitle">
                    Ski Area
                </span>
            </a>

            <nav class="site-header__desktop-nav" aria-label="Primary navigation">
                @for (item of navItems; track item.route) {
                    <a [routerLink]="item.route" routerLinkActive="is-active">
                        {{ item.name }}
                    </a>
                }
            </nav>

            <div class="site-header__actions">
                <a class="site-header__ticket-button" routerLink="/tickets/lift-tickets">
                    <i class="fas fa-ticket" aria-hidden="true"></i>
                    <span>Buy Tickets</span>
                </a>

                <button class="site-header__menu-button"
                        type="button"
                        [attr.aria-expanded]="isMenuOpen()"
                        aria-controls="mobile-navigation"
                        [attr.aria-label]="isMenuOpen() ? 'Close navigation' : 'Open navigation'"
                        (click)="toggleMenu()"
                >
                    <i class="fas"
                       [class.fa-bars]="!isMenuOpen()"
                       [class.fa-xmark]="isMenuOpen()"
                       aria-hidden="true"
                    ></i>
                </button>
            </div>
        </div>
    </div>

    <div id="mobile-navigation"
         class="site-header__mobile-nav"
         [class.is-open]="isMenuOpen()"
    >
        <nav aria-label="Mobile navigation">
            @for (item of navItems; track item.route) {
                <a [routerLink]="item.route"
                   routerLinkActive="is-active"
                   (click)="closeMenu()"
                >
                    {{ item.name }}
                </a>
            }

            <a routerLink="/mountain/conditions"
               routerLinkActive="is-active"
               (click)="closeMenu()"
            >
                Conditions
            </a>

            <a routerLink="/mountain/hours"
               routerLinkActive="is-active"
               (click)="closeMenu()"
            >
                Hours
            </a>

            <a routerLink="/contact"
               routerLinkActive="is-active"
               (click)="closeMenu()"
            >
                Contact
            </a>

            <a class="site-header__mobile-ticket-button"
               routerLink="/tickets/lift-tickets"
               (click)="closeMenu()"
            >
                Buy Tickets
            </a>
        </nav>
    </div>
</header>
