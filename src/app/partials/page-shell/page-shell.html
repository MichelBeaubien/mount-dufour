<main class="app-page-shell">
    <app-secondary-hero [hero]="hero()"></app-secondary-hero>

    <section class="app-section app-page-shell__content">
        <div class="container">
            <div class="app-panel app-page-shell__panel">
                <span class="app-eyebrow">Mount Dufour</span>
                <h2 class="app-heading app-heading--sm">This page is taking shape.</h2>
                <p class="app-copy">Content and details for {{ page().label }} will be published here before the next season.</p>
            </div>

            @if (children().length) {
                <div class="app-card-grid app-page-shell__links">
                    @for (child of children(); track child.id) {
                        <a class="app-panel app-panel--link" [routerLink]="child.url">
                            <span class="app-eyebrow">Explore</span>
                            <h2 class="app-heading app-heading--sm">{{ child.label }}</h2>
                            <p class="app-copy">{{ child.summary }}</p>
                            <span class="app-link">View details <i class="fas fa-arrow-right" aria-hidden="true"></i></span>
                        </a>
                    }
                </div>
            }
        </div>
    </section>
</main>
